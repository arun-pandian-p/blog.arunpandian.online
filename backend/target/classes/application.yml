server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: blog-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arun_blog}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

# Application Security & Settings
app:
  supabase:
    url: ${SUPABASE_URL:${VITE_SUPABASE_URL:}}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:${VITE_SUPABASE_PUBLISHABLE_KEY:${VITE_SUPABASE_ANON_KEY:}}}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    jwt-secret: ${SUPABASE_JWT_SECRET:${app.jwt.secret}}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,https://blog.arunpandian.online,https://arunpandian.online}
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
  rate-limit:
    public-requests-per-minute: ${RATE_LIMIT_PER_MINUTE:60}
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.arunpandian: DEBUG
    org.springframework.security: INFO
